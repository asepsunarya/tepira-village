name: Image

# Builds the production image and pushes it to GHCR:
#   ghcr.io/asepsunarya/tepira-village:sha-<full sha>   (immutable; what the VM deploys)
#   ghcr.io/asepsunarya/tepira-village:main             (moving pointer to the newest green main build)
# Push happens only after the "CI" workflow succeeded for a push to main (workflow_run).
# On pull requests the image is only built (proves the Dockerfile works), never pushed.
# The VM (tepira-prod) pulls :main; it never builds.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
  workflow_dispatch:   # manual (re)build of the current main

concurrency:
  group: image-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/asepsunarya/tepira-village

jobs:
  image:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve commit
        id: rev
        run: |
          if [ "${{ github.event_name }}" = workflow_run ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.rev.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: steps.rev.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (push only for green main)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ steps.rev.outputs.push == 'true' }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.rev.outputs.sha }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}
          build-args: |
            GIT_SHA=${{ steps.rev.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
